<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Mohamed Amer – Creative Director</title>
  <meta
    name="description"
    content="Official Portfolio of Mohamed Amer – Creative Director, Graphic & Motion Designer."
  />
  <meta name="theme-color" content="#010208" />
  <meta name="author" content="Mohamed Amer" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Reenie+Beanie&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <style>
    /* =========================================================
       1. CORE VARIABLES & RESET
       ========================================================= */
    :root {
      --bg-page: #010208; 
      --bg-surface: rgba(12, 18, 34, 0.7);
      --bg-surface-soft: rgba(15, 23, 42, 0.8);
      --bg-surface-hover: rgba(22, 30, 50, 0.98);
      
      --border-color: rgba(59, 130, 246, 0.18);
      --border-hover: rgba(59, 130, 246, 0.7);

      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.15);
      --accent-glow: rgba(37, 99, 235, 0.6);
      
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --text-soft: #cbd5f5;
      
      --radius-full: 9999px;
      --radius-card: 24px;

      --font-main: "Plus Jakarta Sans", sans-serif;
      --font-hand: "Reenie Beanie", cursive;
      --font-arabic: "IBM Plex Sans Arabic", sans-serif;

      --z-nav: 1000;
      --z-modal: 2000;
      --z-toast: 3000;
      --z-loader: 4000;
      --z-dock: 500;

      --ease-smooth: cubic-bezier(0.23, 1, 0.32, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none;
      cursor: default;
    }

    /* شيل أي underline من كل اللينكات */
    a {
      text-decoration: none;
      color: inherit;
    }

    a:hover,
    a:focus,
    a:active {
      text-decoration: none;
    }

    a, button, .deck-card, .project-card, .dock-icon, .interactive-icon-card {
      cursor: pointer;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow-x: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body.menu-open { overflow: hidden; }

    ::selection { background: var(--accent); color: #fff; }

    /* REVEAL ANIMATIONS */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(40px) scale(0.98);
      transition:
        opacity 0.9s var(--ease-smooth),
        transform 0.9s var(--ease-smooth);
      will-change: opacity, transform;
    }
    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* RTL MODE */
    html[dir="rtl"] body {
      font-family: var(--font-arabic);
      text-align: right;
    }

    /* =========================================================
       2. LAYOUT UTILITIES
       ========================================================= */
    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 2;
    }

    .section-spacing {
      margin-top: clamp(5rem, 12vh, 10rem);
      margin-bottom: clamp(5rem, 12vh, 10rem);
    }

    .grid-standard {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 24px;
    }

    .col-span-12 { grid-column: span 12; }
    .col-span-8 { grid-column: span 8; }
    .col-span-6 { grid-column: span 6; }
    .col-span-4 { grid-column: span 4; }

    @media (max-width: 1024px) {
      .col-span-8, .col-span-4, .col-span-6 { grid-column: span 12; }
    }

    .masonry-grid {
      column-count: 3;
      column-gap: 24px;
    }
    
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 24px;
      display: block;
    }

    @media (max-width: 1024px) {
      .masonry-grid { column-count: 2; }
    }

    @media (max-width: 768px) {
      .masonry-grid { column-count: 1; }
      .hero-grid { flex-direction: column-reverse; text-align: center; }
      .hero-grid .hero-content { margin: 0 auto; }
      .hero-title span { margin: 0 auto; transform: rotate(-2deg); }
      .orbit-container { margin-bottom: 40px; }
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 16px;
      background: rgba(37, 99, 235, 0.08);
      padding: 8px 18px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .label-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .title-lg {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .section-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 520px;
    }

    .accent-text { 
      color: var(--accent); 
      text-shadow: 0 0 40px rgba(37, 99, 235, 0.3); 
    }

    /* BACKGROUND EFFECTS */
    .ambient-light {
      position: fixed;
      top: 50%; left: 50%;
      width: 120vw; height: 120vh;
      transform: translate(-50%, -50%);
      z-index: 0; pointer-events: none;
      background: radial-gradient(circle at center, rgba(37, 99, 235, 0.09), transparent 60%);
      filter: blur(90px);
    }

    #canvas-bg {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; opacity: 0.28; mix-blend-mode: screen;
    }
    
    .noise-overlay {
      position: fixed; inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1;
    }

    /* =========================================================
       3. NAVBAR
       ========================================================= */
    .navbar {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      max-width: 90%;
      height: 58px;
      background: rgba(10, 15, 30, 0.78);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius-full);
      padding: 6px 8px 6px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      z-index: var(--z-nav);
      transition: all 0.5s var(--ease-smooth);
      box-shadow: 0 10px 30px rgba(0,0,0,0.38), inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .navbar.scrolled {
      top: 14px;
      background: rgba(4, 6, 18, 0.96);
      border-color: rgba(37, 99, 235, 0.4);
      box-shadow: 0 18px 55px rgba(0,0,0,0.7);
      transform: translateX(-50%) scale(0.99);
    }

    .logo {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      color: #fff;
      position: relative;
    }

    .logo::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px; height: 6px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .logo-container,
    .nav-right {
      flex: 0 0 auto;
    }

    .nav-center {
      display: flex;
      gap: 4px;
      flex: 1;
      justify-content: center;
    }

    .nav-link {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: var(--radius-full);
      transition: all 0.28s var(--ease-smooth);
      position: relative;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(255,255,255,0.04);
    }
    
    .nav-link.active-section {
      color: #fff;
      background: rgba(37, 99, 235, 0.18);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 0%, rgba(255,255,255,0.18), rgba(15,23,42,0.9));
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: 0.3s var(--ease-smooth);
      box-shadow: 0 10px 25px rgba(15,23,42,0.8);
    }

    .nav-btn-icon:hover {
      background: radial-gradient(circle at 30% 0%, rgba(59,130,246,0.7), rgba(15,23,42,1));
      border-color: var(--accent);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 16px 40px rgba(37,99,235,0.55);
    }

    /* MOBILE MENU */
    .mobile-menu-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(37,99,235,0.35), #020617 55%);
      backdrop-filter: blur(18px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .mobile-menu-overlay.active { opacity: 1; pointer-events: auto; }

    .mobile-link {
      font-size: 2.2rem;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      transition: 0.3s;
      transform: translateY(20px);
      opacity: 0;
    }

    .mobile-menu-overlay.active .mobile-link {
      transform: translateY(0);
      opacity: 1;
      transition-delay: calc(var(--i) * 0.07s);
    }

    .mobile-link:hover { color: var(--accent); }

    @media (max-width: 900px) {
      .nav-center { display: none; }
      .navbar { padding: 6px 8px 6px 20px; }
    }

    /* =========================================================
       4. BUTTONS
       ========================================================= */
    .btn-primary, .btn-glass {
      padding: 14px 30px;
      border-radius: var(--radius-full);
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s var(--ease-smooth);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .btn-primary::before,
    .btn-glass::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 0% 0%, rgba(255,255,255,0.2), transparent 55%);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: -1;
    }

    .btn-primary {
      background: linear-gradient(120deg, #2563eb, #4f46e5);
      color: #fff;
      box-shadow: 0 4px 24px rgba(37, 99, 235, 0.45);
      border: 1px solid rgba(191,219,254,0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.7);
    }

    .btn-primary:hover::before,
    .btn-glass:hover::before {
      opacity: 1;
    }

    .btn-glass {
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(148,163,184,0.5);
      color: #e5e7eb;
    }

    .btn-glass:hover {
      background: rgba(15,23,42,1);
      border-color: rgba(209,213,219,0.9);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(15,23,42,0.8);
    }

    /* =========================================================
       5. HERO (APPLE-STYLE)
       ========================================================= */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 110px;
    }

    .hero-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 40px;
    }

    .hero-content {
      max-width: 650px;
      position: relative;
    }

    .hero-tagline {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: clamp(3.6rem, 8vw, 5.8rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1.6rem;
      letter-spacing: -0.04em;
    }

    .hero-title span {
      display: inline-block;
      color: var(--accent);
      font-family: var(--font-hand);
      font-weight: 400;
      font-size: 0.65em;
      margin-left: 12px;
      transform: rotate(-4deg);
      text-shadow: 0 0 40px rgba(37, 99, 235, 0.6);
    }

    .hero-desc {
      font-size: 1.08rem;
      color: var(--text-muted);
      margin-bottom: 2.4rem;
      max-width: 540px;
      line-height: 1.7;
    }

    .hero-badge-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-bottom: 18px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .hero-badge-pill {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
      background: rgba(15,23,42,0.7);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-badge-pill i {
      font-size: 0.9rem;
      color: var(--accent);
    }

    .hero-micro-note {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 14px;
      opacity: 0.85;
      display: flex;
      align-items:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed 3amer - Graphic Design Portfolio</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&family=Permanent+Marker&family=Rock+Salt&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050A14;
            --bg-grid: #0f1623;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --accent-blue: #2196F3;
            --card-bg: rgba(30, 41, 59, 0.7);
            --polaroid-bg: #ffffff;
            --pin-red: #ef4444;
            --pin-blue: #3b82f6;

            --cb-paper: #fdfbf7; 
            --cb-text-blue: #1565C0;
            --cb-text-dark: #333333;

            --contact-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Open Sans', sans-serif;
            color: var(--text-white);
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 50px;
            text-transform: uppercase;
            text-shadow: 0px 0px 15px rgba(255,255,255,0.2);
            letter-spacing: 2px;
            color: white;
        }

        /* reveal animation */
        .reveal {
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .delay-1 { transition-delay: 0.1s; }
        .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; }
        .delay-4 { transition-delay: 0.4s; }
        .delay-5 { transition-delay: 0.5s; }

        /* HERO */
        header {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .red-string {
            position: absolute;
            top: 20%;
            left: -10%;
            width: 120%;
            height: 200px;
            pointer-events: none;
            z-index: 1;
            opacity: 0; 
            animation: fadeInString 1.5s ease-out forwards 0.5s;
        }
        @keyframes fadeInString { to { opacity: 1; } }

        .red-string path {
            fill: none;
            stroke: #ff3b30;
            stroke-width: 3;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .hero-wrapper {
            text-align: center;
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
        }

        .hero-top-text {
            font-family: 'Shadows Into Light', cursive;
            font-size: 3rem;
            color: white;
            margin-bottom: -10px;
            display: block;
            font-weight: 400;
        }

        .hero-title-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0;
        }

        .port-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 8rem;
            color: white;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            letter-spacing: -2px;
            line-height: 1;
        }

        .folio-text {
            font-weight: 400;
            font-size: 4rem;
            color: #4fc3f7;
            font-family: 'Rock Salt', cursive;
            text-shadow: 0 0 15px #03a9f4;
            margin-left: -10px;
        }

        .hero-buttons {
            margin-top: 50px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 12px 35px;
            border-radius: 6px;
            font-family: 'Open Sans', sans-serif;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(to bottom, #2196F3, #1976D2);
            color: white;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
            border: none;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn:hover { transform: scale(1.05); }

        /* sticky notes */
        .sticky {
            position: absolute;
            width: 140px;
            height: 140px; 
            padding: 0;
            background: transparent;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.5);
            z-index: 5;
            transform-origin: center;
            opacity: 0; 
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border-radius: 10px;
            overflow: hidden;
        }

        .sticky img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 10px;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0) rotate(0deg); }
            to { opacity: 1; transform: scale(1) rotate(var(--rot)); }
        }

        .pin {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .pin.red { background: radial-gradient(circle at 30% 30%, #ff6b6b, #d32f2f); }
        .pin.blue { background: radial-gradient(circle at 30% 30%, #64b5f6, #1976d2); }

        .note-1 { top: 15%; left: 8%; --rot: -5deg; animation-delay: 0.2s; }
        .note-2 { top: 22%; left: 20%; --rot: 3deg; animation-delay: 0.4s; }
        .note-3 { top: 12%; right: 12%; --rot: 2deg; width: 150px; height: auto; animation-delay: 0.6s; } 
        .note-4 { bottom: 20%; left: 10%; --rot: -3deg; animation-delay: 0.8s; }
        .note-5 { bottom: 15%; right: 15%; --rot: 4deg; animation-delay: 1.0s; }

        /* hero profile */
        .profile-frame-hero {
            position: absolute;
            top: 35%;
            right: 15%;
            width: 240px;
            background: white;
            padding: 10px 10px 40px 10px;
            transform: rotate(5deg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 8;
            opacity: 0;
            animation: floatIn 1.5s ease-out forwards 0.5s;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(50px) rotate(0deg); }
            to { opacity: 1; transform: translateY(0) rotate(5deg); }
        }

        .profile-frame-hero img { width: 100%; display: block; }
        .profile-name-hero {
            color: #333;
            font-family: 'Shadows Into Light', cursive;
            text-align: center;
            margin-top: 10px;
            font-size: 1.2rem;
        }

        /* ABOUT / CLIPBOARD */
        .clipboard-section {
            padding: 100px 0;
            position: relative;
            perspective: 1000px; 
        }

        .clipboard-container {
            width: 900px;
            margin: 0 auto;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(2deg);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .clipboard-container:hover { transform: rotateX(0deg) scale(1.02); }

        .clipboard-board {
            background-color: #2c2c2c;
            width: 100%;
            min-height: 1000px;
            border-radius: 15px;
            box-shadow: 
                20px 20px 60px rgba(0,0,0,0.6),
                -2px -2px 5px rgba(255,255,255,0.1);
            padding: 20px;
            position: relative;
        }

        .clipboard-paper {
            background-color: var(--cb-paper);
            width: 100%;
            height: 100%;
            border-radius: 4px;
            padding: 90px 50px 50px 50px;
            position: relative;
            color: var(--cb-text-dark);
        }

        .clip-top {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 80px;
            background: linear-gradient(to bottom, #444, #222);
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            z-index: 20;
            border-top: 2px solid #666;
        }
        .clip-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 50px;
            border: 8px solid #aaa;
            border-radius: 8px;
            background: transparent;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .polaroid-cv {
            position: absolute;
            top: 20px;
            right: -60px;
            width: 280px;
            background: white;
            padding: 15px 15px 60px 15px;
            box-shadow: 10px 15px 30px rgba(0,0,0,0.4);
            transform: rotate(6deg);
            z-index: 25;
            transition: transform 0.3s;
        }
        .polaroid-cv:hover { transform: rotate(0deg) scale(1.05); }
        .polaroid-cv img { width: 100%; display: block; }

        .paper-header { margin-bottom: 40px; border-bottom: 3px dashed #ccc; padding-bottom: 20px; }
        .paper-role { font-family: 'Montserrat', sans-serif; font-weight: 800; color: var(--cb-text-blue); text-transform: uppercase; font-size: 1.1rem; letter-spacing: 1px; }
        .paper-name { font-family: 'Permanent Marker', cursive; font-size: 5rem; color: var(--cb-text-blue); line-height: 1; margin: 10px 0; transform: rotate(-2deg); }
        .paper-tagline { font-family: 'Shadows Into Light', cursive; font-size: 1.4rem; color: #666; font-weight: bold; }
        .contact-bar { margin-top: 20px; background: var(--cb-text-blue); color: white; padding: 10px 20px; border-radius: 6px; display: inline-flex; gap: 20px; font-size: 0.9rem; font-weight: 600; }

        .paper-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; }
        .paper-h3 { font-family: 'Montserrat', sans-serif; font-weight: 900; color: var(--cb-text-blue); text-transform: uppercase; font-size: 1.4rem; margin-bottom: 20px; margin-top: 20px; }

        .qr-box { background: white; border: 4px solid #333; width: 160px; height: 160px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 5rem; color: #333; box-shadow: 3px 3px 10px rgba(0,0,0,0.1); border-radius: 8px; }
        .qr-link { font-size: 0.7rem; color: #666; margin-bottom: 30px; display: block;}

        .paper-skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .paper-skill-icon { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 1.2rem; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .ps { background: #31A8FF; color: #001e36; }
        .ai { background: #FF9A00; color: #331e01; }
        .ae { background: #9999FF; color: #000033; }
        .id { background: #FF3366; color: #330014; }
        .pr { background: #9999FF; color: #000033; }
        .figma { background: #F24E1E; color: #fff; }

        .paper-objective { background: #fff9c4; padding: 15px; border-radius: 4px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .paper-objective p { font-size: 1rem; line-height: 1.6; color: #222; }

        /* SKILLS */
        .skills-section { padding: 80px 0; text-align: center; background-color: #080e1a; }
        .skills-subtitle { color: white; font-size: 1.3rem; margin-bottom: 30px; font-weight: 600; }
        .adobe-container { display: flex; justify-content: center; gap: 30px; margin-bottom: 60px; flex-wrap: wrap; }
        .adobe-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .app-icon { width: 75px; height: 75px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .app-name { font-size: 0.9rem; color: #ccc; }

        .expertise-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; max-width: 900px; margin: 0 auto; }
        .pill { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 12px 28px; border-radius: 50px; color: white; font-size: 1rem; display: flex; align-items: center; gap: 10px; }
        .pill i { color: var(--accent-blue); }

        /* EXPERIENCE */
        .experience-section { padding: 80px 0; }
        .timeline { max-width: 800px; margin: 50px auto; position: relative; border-left: 3px solid #1e293b; padding-left: 45px; }
        .exp-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid #2d3748; border-radius: 12px; padding: 30px; margin-bottom: 35px; position: relative; }
        .timeline-dot { position: absolute; left: -52px; top: 35px; width: 14px; height: 14px; background: var(--accent-blue); border-radius: 50%; box-shadow: 0 0 15px var(--accent-blue); border: 2px solid #050A14; }
        .exp-header { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
        .exp-role { font-size: 1.4rem; font-weight: 700; color: white; }
        .exp-date { color: var(--accent-blue); font-weight: 600; }
        .exp-company { color: #94a3b8; font-style: italic; margin-bottom: 20px; display: block; }
        .exp-desc li { color: #cbd5e1; margin-bottom: 8px; padding-left: 5px; list-style-type: disc; margin-left: 20px; line-height: 1.6; font-size: 0.95rem; }

        /* PROJECTS */
        .projects-section { padding: 100px 0; background-color: #080e1a; }
        .projects-header-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 4rem; text-align: center; color: white; margin-bottom: 10px; text-shadow: 0 0 15px rgba(255,255,255,0.2); letter-spacing: 2px; }
        .projects-sub { text-align: center; color: var(--accent-blue); font-size: 1rem; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .projects-sub::before, .projects-sub::after { content: ""; width: 30px; height: 2px; background: var(--accent-blue); opacity: 0.5; }

        .featured-card {
            position: relative;
            width: 100%;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 60px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            background-image: url('water line.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
        }
        .featured-overlay {
            width: 100%;
            padding: 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
        }
        .featured-badge { background: var(--accent-blue); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; display: inline-block; margin-bottom: 15px; }
        .featured-title { font-size: 2.5rem; font-weight: 900; color: white; margin-bottom: 10px; text-transform: uppercase; }
        .featured-desc { color: #ccc; font-size: 1rem; max-width: 600px; line-height: 1.6; }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }

        .project-card-clean {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .clean-img { width: 100%; height: 250px; object-fit: cover; }
        .clean-info { padding: 20px; }
        .clean-title { font-size: 1.2rem; font-weight: 700; color: white; margin-bottom: 5px; }
        .clean-tags { font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px; }
        .clean-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .clean-link { color: white; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        .clean-link:hover { color: var(--accent-blue); }

        /* CONTACT */
        .contact-section { padding: 100px 0; text-align: center; }
        .contact-card { background: var(--contact-bg); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 60px 40px; border-radius: 20px; max-width: 700px

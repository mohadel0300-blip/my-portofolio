name: Optimize portfolio images

on:
  push:
    paths:
      - 'tools/optimize_portfolio_images.py'
      - '.github/workflows/optimize-portfolio-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Generate web images
        run: python tools/optimize_portfolio_images.py
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/
          git diff --cached --quiet || git commit -m "Generate web-optimized portfolio images"
          git push

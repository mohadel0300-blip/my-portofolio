name: Import verified brand assets
on:
  push:
    paths:
      - 'brand-assets-pack.zip'
      - '.github/workflows/import-brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Extract verified assets to repository root
        run: unzip -oj brand-assets-pack.zip -d .
      - name: Optimize imported images
        run: python tools/optimize_portfolio_images.py
      - name: Commit imported assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f --ignore-unmatch brand-assets-pack.zip
          git diff --cached --quiet || git commit -m 'Import verified Social Lab and Brief assets [skip ci]'
          git push

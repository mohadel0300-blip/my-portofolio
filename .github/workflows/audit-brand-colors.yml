name: Audit portfolio brand colors
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/audit_brand_colors.py'
      - '.github/workflows/audit-brand-colors.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/audit_brand_colors.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand-color-audit.json
          git diff --cached --quiet || git commit -m 'Add portfolio brand color audit [skip ci]'
          git push

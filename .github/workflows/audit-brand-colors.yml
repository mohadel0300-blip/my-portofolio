name: Audit portfolio brand groups
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/audit_brand_colors.py'
      - 'tools/audit_brand_text.py'
      - '.github/workflows/audit-brand-colors.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install pillow pytesseract
      - run: python tools/audit_brand_colors.py
      - run: python tools/audit_brand_text.py
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand-color-audit.json brand-text-audit.json
          git diff --cached --quiet || git commit -m 'Add verified portfolio brand audits [skip ci]'
          git push
